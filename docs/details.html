<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deprivation in Northern Ireland | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="icon" href="assets/img/icon/favicon.ico" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="css/lookup.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header id="site-header" class="navbar p-0"></header>

<main class="flex-grow-1 container py-4">
    <div class="row align-items-start">
        <div class="col-lg-8 order-2 order-lg-1">
            <div id="summary"></div>
        </div>
        <div class="col-lg-4 order-1 order-lg-2">
            <form id="search" class="lookup-search" novalidate>
                <label for="pc" class="form-label search-label">Search Postcode</label>
                <div class="input-group">
                    <input id="pc" name="pc" type="search" class="form-control rounded-0 border-secondary" placeholder="Enter postcode" autocomplete="off" />
                    <button type="submit" class="search-btn" aria-label="Search">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
                <p id="search-error" class="text-danger" hidden></p>
            </form>
        </div>
    </div>
    <div id="scales"></div>
</main>

    <footer id="site-footer" class="footer py-4 bg-nisra text-nisra pb-5"></footer>
    <script src="js/layout.js"></script>
    <script src="js/search.js"></script>
    <script src="js/scale.js"></script>
    <script src="js/details.js"></script>
  </body>
