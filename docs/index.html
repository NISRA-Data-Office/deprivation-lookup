<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deprivation in Northern Ireland | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="icon" href="assets/img/icon/favicon.ico" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="css/lookup.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header id="site-header" class="navbar p-0"></header>

        <main class="flex-grow-1 d-flex">
  <div id="background-map" class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

        <div class="index-box">

          <h1 class="mb-3">NI Multiple Deprivation Measures</h1>

          <h2 class="mb-4">
            Find out about deprivation in your neighbourhood
          </h2>

          <form id="search" class="lookup-search mx-auto" novalidate>
            <div class="input-group">
              <input id="pc" name="pc" type="search" class="form-control rounded-0 border-secondary" placeholder="Enter postcode" aria-label="Postcode" autocomplete="postal-code">
              <button type="submit" class="search-btn" type="button" aria-label="Search"><i class="bi bi-search"></i></button>
            </div>

            <p id="search-error" class="text-danger mt-2 mb-0 text-start" role="alert" hidden></p>
          </form>

        </div>

      </div>
    </div>
  </div>
</main>

    <footer id="site-footer" class="footer py-4 bg-nisra text-nisra pb-5"></footer>
    <script src="js/layout.js"></script>
    <script src="js/search.js"></script>
  </body>
</html>
